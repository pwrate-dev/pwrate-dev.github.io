<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaturvOS</title>

    <meta name="keywords" content="pwrat,saturvos,sistema operacional,32-bit,assembly,C">
    <meta name="author" content="PWRAT">

    <link rel="icon" href="logo.jpg" type="image/png">
    <link rel="shortcut icon" href="logo.jpg" type="image/jpg">

    <style>
        :root {
            --amarelo: #FFEA00; 
            --preto: #0c0c0c;
            --branco: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--preto);
            color: var(--branco);
            font-family: "Courier New", Courier, monospace;
            display: flex;
            justify-content: center;
        }

        .main-container {
            max-width: 600px;
            width: 100%;
            background-color: var(--preto);
            padding: 30px;
            text-align: center;
        }

        header {
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--amarelo);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }

        p {
            margin: 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        .links-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .links-list li a {
            color: var(--amarelo);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.1rem;
            transition: 0.1s;
        }

        .links-list li a:hover {
            color: var(--branco);
            text-decoration: underline;
        }

        footer {
            color: #555;
            font-size: 0.8rem;
            margin-top: 40px;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <img src="logo.jpg" alt="Logo SaturvOS" class="logo-img">
        <h1>SaturvOS</h1>
        <p>O Castelo Virtual de um Príncipe de Baixo Nível.</p>
    </header>

    <ul class="links-list">
        <li><a href="https://github.com/pwrate-dev/pwrate-dev.github.io/releases/tag/v0.5" target="_blank">[+] Baixar SaturvOS.IMG (v0.5)</a></li>
        <li><a href="https://github.com/pwrate-dev" target="_blank">[+] GitHub / Repositórios</a></li>
        <li><a href="https://livepix.gg/pwrate" target="_blank">[+] Apoiar (LivePix)</a></li>
    </ul>

    <footer>
        SATURVOS // 2026 // PWRAT
    </footer>
</div>

</body>
</html>
