<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaturvOS // Rádio</title>

    <link rel="icon" href="logo.jpg" type="image/jpeg">

    <style>
        :root {
            --amarelo: #FFEA00;
            --preto: #0c0c0c;
            --branco: #e0e0e0;
            --cinza-escuro: #151515;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--preto);
            color: var(--branco);
            font-family: "Courier New", Courier, monospace;
            display: flex;
            justify-content: center;
        }

        .main-container {
            max-width: 600px;
            width: 100%;
        }

        header {
            margin-bottom: 35px;
            border-bottom: 1px dashed #333;
            padding-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: var(--amarelo);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }

        .freq-tag {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .nav-back {
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 12px;
        }

        .nav-back:hover {
            color: var(--amarelo);
        }

        .panel {
            border-left: 2px solid var(--amarelo);
            padding-left: 15px;
            margin-bottom: 32px;
        }

        .status-box {
            background-color: var(--cinza-escuro);
            border: 1px solid #2a2a2a;
            padding: 12px 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .led {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #333;
            margin-right: 8px;
            border: 1px solid #555;
        }

        .led.on {
            background-color: var(--amarelo);
            box-shadow: 0 0 8px var(--amarelo);
        }

        button {
            background-color: transparent;
            color: var(--amarelo);
            border: 1px solid var(--amarelo);
            padding: 10px 18px;
            font-family: inherit;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: var(--amarelo);
            color: var(--preto);
            font-weight: bold;
        }

        .site-footer {
            color: #555;
            font-size: 0.8rem;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px dashed #222;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <a href="index.html" class="nav-back">&lt; Voltar para Home</a>
        <h1>Estação SaturvOs </h1>
        
    </header>

    <main>
        <section class="panel">
            <div class="status-box">
                <span><span id="radio-led" class="led"></span><span id="radio-status">DESLIGADO</span></span>
                
            </div>

            <button id="btn-power">Ligar Rádio</button>
        </section>
    </main>

    <footer class="site-footer">
        SATURVOS // 2026 // PWRAT
    </footer>
</div>

<script>
// =========================================================================
// CONFIGURAÇÃO DO CHIADO
// =========================================================================
const GANHO_CHIADO = 0.04;
const FREQUENCIA_FILTRO_HZ = 1450;
// =========================================================================

let audioCtx = null;
let radioOn = false;

const btnPower = document.getElementById('btn-power');
const radioLed = document.getElementById('radio-led');
const radioStatus = document.getElementById('radio-status');

function setupAudio() {
    if (audioCtx) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    // Chiado / estática contínua de rádio
    const bufferSize = audioCtx.sampleRate * 3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
    }

    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = buffer;
    whiteNoise.loop = true;

    const bandpass = audioCtx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = FREQUENCIA_FILTRO_HZ;
    bandpass.Q.value = 0.7;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = GANHO_CHIADO;

    whiteNoise.connect(bandpass);
    bandpass.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    whiteNoise.start();
}

btnPower.addEventListener('click', async () => {
    setupAudio();
    if (!radioOn) {
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        radioOn = true;
        radioLed.classList.add('on');
        btnPower.textContent = 'Desligar Rádio';
        radioStatus.textContent = 'LIGADO';
    } else {
        radioOn = false;
        radioLed.classList.remove('on');
        await audioCtx.suspend();
        btnPower.textContent = 'Ligar Rádio';
        radioStatus.textContent = 'DESLIGADO';
    }
});
</script>

</body>
</html>
